name: Release
# Push a tag like v1.0 (matching VERSION in scripts/build-app.sh) to build the app and publish a release.
# Release notes come from .github/release-notes/<tag>.md.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'mhimt-lab/mozaipoon'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Show toolchain
        run: sw_vers && swift --version
      - name: Build universal app and zip
        run: zsh scripts/build-app.sh --zip
      - name: Check version and write notes
        run: |
          set -euo pipefail
          ZIP="build/Mozaipoon-${GITHUB_REF_NAME#v}.zip"
          test -f "$ZIP" || { echo "::error::$ZIP not found; VERSION in scripts/build-app.sh must match the tag"; exit 1; }
          test -f ".github/release-notes/$GITHUB_REF_NAME.md" || { echo "::error::release notes missing"; exit 1; }
          lipo -archs "build/モザイぷーん.app/Contents/MacOS/WipeMosaic"
          codesign --verify --deep --strict "build/モザイぷーん.app"
          SHA=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          { cat ".github/release-notes/$GITHUB_REF_NAME.md"; printf '\nSHA-256: `%s`\n' "$SHA"; } > "$RUNNER_TEMP/notes.md"
          # Also under a name without the version, for the README's direct link
          # (releases/latest/download/Mozaipoon.zip).
          cp "$ZIP" build/Mozaipoon.zip
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "モザイぷーん ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" "$ZIP" build/Mozaipoon.zip
